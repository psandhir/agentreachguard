name: FastAgent Flow Adjudication

on:
  push:
    branches:
      - research/frozen90-3528845d
    paths:
      - "scripts/fastagent_flow_adjudication.py"
      - ".github/workflows/fastagent-flow-adjudication.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out HorusTrace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install current HorusTrace
        run: python -m pip install -e .

      - name: Adjudicate pinned FastAgent flows
        run: python scripts/fastagent_flow_adjudication.py

      - name: Upload adjudication report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fastagent-flow-adjudication
          path: fastagent-flow-adjudication.json
          if-no-files-found: error
