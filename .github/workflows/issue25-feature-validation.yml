name: Issue 25 Feature Validation

on:
  push:
    branches:
      - research/frozen90-3528845d
    paths:
      - ".github/workflows/issue25-feature-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HORUSTRACE_SCANNER_REF: "7256538db816a13138729dda394e065895ea3b92"
    steps:
      - name: Check out research harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install PR 58 scanner
        run: python -m pip install "git+https://github.com/psandhir/horustrace.git@7256538db816a13138729dda394e065895ea3b92"

      - name: Validate public positive controls
        run: python scripts/issue25_positive_control_discovery.py

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue25-feature-validation
          path: issue25-positive-control-discovery.json
          if-no-files-found: error
