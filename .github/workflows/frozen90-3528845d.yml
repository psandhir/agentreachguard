name: Frozen 90 Validation 3528845d

on:
  push:
    branches:
      - research/frozen90-base-3528845d-v2
    paths:
      - ".github/workflows/frozen90-3528845d.yml"
      - "src/**"
      - "scripts/frozen_corpus_rescan.py"
      - "benchmarks/public-corpus/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozen90-3528845d-v2
  cancel-in-progress: false

jobs:
  scan:
    name: Cohort ${{ matrix.cohort }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cohort: [a, b, c]

    steps:
      - name: Check out validation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Record validation provenance
        run: |
          echo "Validation checkout: $GITHUB_SHA"
          echo "Scanner base commit: 3528845d343f3764544699081eff37e4cff9dbfd"
          git log -1 --oneline

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install validation HorusTrace
        run: |
          python -m pip install -e .
          horustrace --version

      - name: Scan frozen cohort
        run: |
          python scripts/frozen_corpus_rescan.py \
            --manifest benchmarks/public-corpus/cohort-${{ matrix.cohort }}-v1.json \
            --cohort ${{ matrix.cohort }} \
            --output-prefix validation-${{ matrix.cohort }}

      - name: Print verbose report
        if: always()
        run: |
          echo "===== COHORT ${{ matrix.cohort }} MARKDOWN ====="
          cat validation-${{ matrix.cohort }}.md || true
          echo "===== COHORT ${{ matrix.cohort }} JSON SUMMARY ====="
          python - <<'PY'
          import json, os
          c=os.environ["COHORT"]
          p=f"validation-{c}.json"
          try:
              d=json.load(open(p))
              print(json.dumps(d.get("summary",{}), indent=2))
          except Exception as e:
              print(e)
          PY
        env:
          COHORT: ${{ matrix.cohort }}

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frozen90-3528845d-${{ matrix.cohort }}
          path: |
            validation-${{ matrix.cohort }}.json
            validation-${{ matrix.cohort }}.md
          if-no-files-found: warn
