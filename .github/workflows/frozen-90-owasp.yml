name: Frozen 90 OWASP Baseline

on:
  push:
    branches: [research/frozen-90-owasp]
    paths:
      - ".github/workflows/frozen-90-owasp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozen-90-owasp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Cohort ${{ matrix.cohort }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cohort: [a, b, c]

    steps:
      - name: Check out HorusTrace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install HorusTrace
        run: python -m pip install -e .

      - name: Run frozen cohort
        env:
          HORUSTRACE_SCANNER_REF: ${{ github.sha }}
        run: |
          python scripts/frozen_corpus_rescan.py \
            --cohort "${{ matrix.cohort }}" \
            --manifest "benchmarks/public-corpus/cohort-${{ matrix.cohort }}-v1.json" \
            --output-prefix "frozen-90-owasp-${{ matrix.cohort }}"

      - name: Upload cohort results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frozen-90-owasp-${{ matrix.cohort }}
          path: |
            frozen-90-owasp-${{ matrix.cohort }}.json
            frozen-90-owasp-${{ matrix.cohort }}.md
          if-no-files-found: warn
