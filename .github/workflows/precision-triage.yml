name: Precision Triage

on:
  push:
    branches:
      - research/flow-attribution-triage
    paths:
      - ".github/workflows/precision-triage.yml"

permissions:
  contents: read

jobs:
  triage:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: issue-triager-agent
            repo: pamelafox/issue-triager-agent
            sha: 64d94249a94cfc2eefb5d52c0a954a936bc6b421
          - name: github-standup-agent
            repo: andrewm4894/github-standup-agent
            sha: cf2ff06f96409e9515580d5ea4d6c94774b12436

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install HorusTrace main
        run: python -m pip install "git+https://github.com/psandhir/horustrace.git@main"
      - name: Fetch frozen target
        env:
          TARGET_REPO: ${{ matrix.repo }}
          TARGET_SHA: ${{ matrix.sha }}
        run: |
          git init -q /tmp/target
          git -C /tmp/target remote add origin "https://github.com/${TARGET_REPO}.git"
          git -C /tmp/target fetch --quiet --depth=1 --filter=blob:none origin "${TARGET_SHA}"
          git -C /tmp/target checkout --quiet --detach FETCH_HEAD
      - name: Inspect precision cases
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from horustrace.scanner import scan

          graph, findings = scan(Path("/tmp/target"))
          interesting_names = {
              "confirm_slack_publish",
              "publish_standup_to_slack",
              "review_issue_node",
              "apply_decision_node",
          }

          for agent in graph.agents:
              for tool in agent.tools:
                  path = str(tool.location.path) if tool.location else ""
                  if (
                      tool.name in interesting_names
                      or path.endswith("src/agent/graph.py")
                      or path.endswith("slack_publish.py")
                  ):
                      print("TOOL " + json.dumps({
                          "agent": agent.name,
                          "name": tool.name,
                          "kind": tool.kind,
                          "capabilities": sorted(tool.capabilities),
                          "approval": tool.approval,
                          "guardrails": tool.guardrails,
                          "metadata": tool.metadata,
                          "location": (
                              {"path": path, "line": tool.location.line}
                              if tool.location else None
                          ),
                      }, sort_keys=True, default=str))

          for finding in findings:
              path = str(finding.location.path) if finding.location else ""
              if (
                  path.endswith("src/agent/graph.py")
                  or path.endswith("slack_publish.py")
                  or finding.agent in {a.name for a in graph.agents}
              ):
                  print("FINDING " + json.dumps(finding.as_dict(), sort_keys=True, default=str))

          print("COUNTS " + json.dumps({
              "agents": len(graph.agents),
              "tools": len(graph.all_tools()),
              "findings": len(findings),
              "by_rule": {
                  rule: sum(f.rule_id == rule for f in findings)
                  for rule in sorted({f.rule_id for f in findings})
              },
          }, sort_keys=True))
          PY
