name: Validate PR128 Exact Final

on:
  push:
    branches:
      - research/validate-pr128-exact-final
    paths:
      - ".github/workflows/validate-pr128-exact-final.yml"

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Execute frozen cohort with exact PR128 head
        shell: bash
        run: |
          set +e
          python scripts/deployment_authority_study.py \
            --output-json pr128-exact-final.json \
            --output-markdown pr128-exact-final.md
          code=$?
          echo "Study exit code: $code"
          if [[ "$code" == "2" ]]; then exit 2; fi
          exit 0
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr128-exact-final
          path: |
            pr128-exact-final.json
            pr128-exact-final.md
          if-no-files-found: warn
          retention-days: 30
