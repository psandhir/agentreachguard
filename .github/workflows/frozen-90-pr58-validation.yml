name: Frozen 90 PR58 Validation

on:
  push:
    branches:
      - research/frozen90-3528845d
    paths:
      - ".github/workflows/frozen-90-pr58-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Cohort ${{ matrix.cohort }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cohort: [a, b, c]
    env:
      HORUSTRACE_SCANNER_REF: "7256538db816a13138729dda394e065895ea3b92"
    steps:
      - name: Check out research harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install PR 58 scanner
        run: python -m pip install "git+https://github.com/psandhir/horustrace.git@7256538db816a13138729dda394e065895ea3b92"

      - name: Scan frozen cohort
        run: |
          python scripts/frozen_corpus_rescan.py \
            --cohort "${{ matrix.cohort }}" \
            --manifest "benchmarks/public-corpus/cohort-${{ matrix.cohort }}-v1.json" \
            --output-prefix "frozen-pr58-${{ matrix.cohort }}"

      - name: Upload cohort report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frozen-pr58-${{ matrix.cohort }}
          path: |
            frozen-pr58-${{ matrix.cohort }}.json
            frozen-pr58-${{ matrix.cohort }}.md
          if-no-files-found: error
