name: FastAgent Post-74 Validation
# rerun after manifest schema fix

on:
  push:
    branches: [research/fast-agent-post74]
    paths:
      - ".github/workflows/fast-agent-post74.yml"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Scan pinned FastAgent
        env:
          HORUSTRACE_SCANNER_REF: ${{ github.sha }}
        run: |
          python scripts/frozen_corpus_rescan.py \
            --cohort a \
            --manifest benchmarks/public-corpus/fast-agent-post74.json \
            --output-prefix fast-agent-post74
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fast-agent-post74
          path: |
            fast-agent-post74.json
            fast-agent-post74.md
          if-no-files-found: warn
