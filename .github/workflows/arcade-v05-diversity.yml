name: ArcadeAI v0.5 Provenance Diversity Validation

on:
  push:
    branches: [research/arcade-v05-diversity]
    paths:
      - ".github/workflows/arcade-v05-diversity.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out HorusTrace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install HorusTrace
        run: python -m pip install -e .
      - name: Check out pinned ArcadeAI corpus revision
        run: |
          git clone --filter=blob:none https://github.com/ArcadeAI/arcade-mcp.git arcade-mcp
          git -C arcade-mcp checkout 6e4d67c95422ecdc23b6e045ca9c4837b0838d55
      - name: Validate residual flow provenance
        run: |
          python - <<'PY' > arcade-v05-diversity.json
          import json
          from pathlib import Path
          from horustrace.scanner import scan

          graph, _ = scan(Path("arcade-mcp").resolve())
          unknown = []
          for flow in graph.flow_paths:
              if flow.agent_reachability.value != "unknown":
                  continue
              unknown.append({
                  "flow_id": flow.flow_id,
                  "execution_context": flow.execution_context.value,
                  "agent_reachability": flow.agent_reachability.value,
                  "agent_reachability_basis": flow.metadata.get("agent_reachability_basis"),
                  "call_chain": flow.metadata.get("call_chain") or [],
                  "inbound_entrypoint_kinds": flow.metadata.get("inbound_entrypoint_kinds") or [],
                  "inbound_entrypoint_candidates": flow.metadata.get("inbound_entrypoint_candidates"),
                  "inbound_entrypoints": flow.metadata.get("inbound_entrypoints") or [],
                  "inbound_provenance_truncated": flow.metadata.get("inbound_provenance_truncated"),
              })
          print(json.dumps({"unknown_count": len(unknown), "unknown_flows": unknown}, indent=2))
          PY
          cat arcade-v05-diversity.json
      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arcade-v05-diversity
          path: arcade-v05-diversity.json
