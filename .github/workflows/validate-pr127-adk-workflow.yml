name: Validate PR127 ADK Workflow

on:
  push:
    branches:
      - research/validate-pr127-adk-workflow
    paths:
      - ".github/workflows/validate-pr127-adk-workflow.yml"

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Execute frozen cohort with PR127 code
        shell: bash
        run: |
          set +e
          python scripts/deployment_authority_study.py \
            --output-json pr127-results.json \
            --output-markdown pr127-results.md
          code=$?
          echo "study_exit=$code"
          if [[ -f pr127-results.json ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("pr127-results.json").read_text())
          print(json.dumps(report["summary"], indent=2))
          for case in report["cases"]:
              if case["case_id"] == "natural-006":
                  print(json.dumps(case, indent=2))
          PY
          fi
          if [[ "$code" == "2" ]]; then exit 2; fi
          exit 0
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr127-adk-workflow-validation
          path: |
            pr127-results.json
            pr127-results.md
          if-no-files-found: warn
          retention-days: 30
