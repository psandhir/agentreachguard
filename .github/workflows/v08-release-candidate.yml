name: v0.8 Release Candidate Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  release-wheel:
    name: v0.8 clean-wheel scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build release wheel
        run: |
          python -m pip install build
          python -m build
          python -m venv rc-venv
          rc-venv/bin/pip install dist/*.whl
          rc-venv/bin/horustrace --version | grep -q "horustrace 0.8.0"
      - name: Aligned deployment succeeds
        run: |
          rc-venv/bin/horustrace reconcile examples/deployment-reconciliation             --deployment-evidence examples/deployment-reconciliation/deployment-evidence.yaml             --format json             --fail-on-excess-authority             --fail-on-deployed-policy-violation             > aligned.json
          python - <<'PY'
          import json
          report = json.load(open("aligned.json", encoding="utf-8"))
          assert report["reconciliation"]["agents"][0]["status"] == "aligned"
          assert report["summary"]["excess_authority_agents"] == 0
          assert report["summary"]["deployed_policy_violations"] == 0
          assert report["runtime_effectiveness"] == "not_verified"
          PY
      - name: Excess authority gate fails closed
        shell: bash
        run: |
          set +e
          rc-venv/bin/horustrace reconcile examples/deployment-reconciliation             --deployment-evidence examples/deployment-reconciliation/deployment-evidence-expanded.yaml             --format json             --fail-on-excess-authority             > excess.json
          rc=$?
          set -e
          test "$rc" -eq 2
          python - <<'PY'
          import json
          report = json.load(open("excess.json", encoding="utf-8"))
          agent = report["reconciliation"]["agents"][0]
          assert agent["status"] == "excess_authority"
          assert agent["excess"]["roles"] == ["roles/storage.objectAdmin"]
          assert agent["excess"]["permissions"] == ["storage.objects.delete"]
          PY
      - name: Deployment regression gate detects expansion
        shell: bash
        run: |
          set +e
          rc-venv/bin/horustrace reconcile examples/deployment-reconciliation             --deployment-evidence examples/deployment-reconciliation/deployment-evidence-expanded.yaml             --baseline-deployment-evidence examples/deployment-reconciliation/deployment-evidence.yaml             --format json             --fail-on-deployment-regression             > regression.json
          rc=$?
          set -e
          test "$rc" -eq 2
          python - <<'PY'
          import json
          report = json.load(open("regression.json", encoding="utf-8"))
          delta = report["deployment_delta"]
          assert delta["summary"]["regressed_agents"] == 1
          assert delta["summary"]["introduced_excess_permissions"] == 1
          PY
      - name: Privilege reduction is not a regression
        run: |
          rc-venv/bin/horustrace reconcile examples/deployment-reconciliation             --deployment-evidence examples/deployment-reconciliation/deployment-evidence.yaml             --baseline-deployment-evidence examples/deployment-reconciliation/deployment-evidence-expanded.yaml             --format json             --fail-on-deployment-regression             > reduction.json
          python - <<'PY'
          import json
          report = json.load(open("reduction.json", encoding="utf-8"))
          delta = report["deployment_delta"]
          assert delta["summary"]["regressed_agents"] == 0
          assert delta["summary"]["improved_agents"] == 1
          PY

  frozen-90:
    name: Frozen cohort ${{ matrix.cohort }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - cohort: a
            manifest: benchmarks/public-corpus/cohort-a-v1.json
          - cohort: b
            manifest: benchmarks/public-corpus/cohort-b-v1.json
          - cohort: c
            manifest: benchmarks/public-corpus/cohort-c-v1.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install v0.8 release candidate
        run: |
          python -m pip install -e .
          horustrace --version | grep -q "horustrace 0.8.0"
      - name: Scan frozen cohort
        env:
          HORUSTRACE_SCANNER_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/frozen_corpus_rescan.py             --cohort "${{ matrix.cohort }}"             --manifest "${{ matrix.manifest }}"             --output-prefix "v08-rc-${{ matrix.cohort }}"
      - name: Require complete execution
        run: |
          python - "${{ matrix.cohort }}" <<'PY'
          import json
          import sys
          cohort = sys.argv[1]
          report = json.load(open(f"v08-rc-{cohort}.json", encoding="utf-8"))
          summary = report["summary"]
          assert summary["scanned"] == summary["requested"], summary
          assert summary["scan_errors"] == 0, summary
          assert summary["scan_timeouts"] == 0, summary
          assert summary["clone_failures"] == 0, summary
          assert summary["clone_timeouts"] == 0, summary
          PY
      - name: Upload cohort report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v08-rc-frozen-${{ matrix.cohort }}
          path: |
            v08-rc-${{ matrix.cohort }}.json
            v08-rc-${{ matrix.cohort }}.md
          if-no-files-found: warn
