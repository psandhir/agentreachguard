name: Validate PR128 Required Authority v4

on:
  push:
    branches:
      - research/validate-pr128-required-authority-v4
    paths:
      - ".github/workflows/validate-pr128-required-authority-v4.yml"

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Execute frozen cohort at PR128 head
        shell: bash
        run: |
          set +e
          python scripts/deployment_authority_study.py \
            --output-json pr128-v4-results.json \
            --output-markdown pr128-v4-results.md
          code=$?
          echo "Study exit code: $code"
          if [[ -f pr128-v4-results.json ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("pr128-v4-results.json").read_text())
          print(json.dumps(report["summary"], indent=2))
          print("Expected output:")
          print(json.dumps(report["expected_output_confusion_matrix"], indent=2))
          print("Independent security:")
          print(json.dumps(report["security_classification_confusion_matrix"], indent=2))
          PY
          fi
          if [[ "$code" == "2" ]]; then exit 2; fi
          exit 0
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr128-required-authority-validation-v4
          path: |
            pr128-v4-results.json
            pr128-v4-results.md
          if-no-files-found: warn
          retention-days: 30
