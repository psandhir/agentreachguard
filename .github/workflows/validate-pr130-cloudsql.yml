name: Validate PR130 Cloud SQL

on:
  push:
    branches:
      - research/validate-pr130-cloudsql
    paths:
      - ".github/workflows/validate-pr130-cloudsql.yml"

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Execute frozen cohort with PR130 code
        shell: bash
        run: |
          set +e
          python scripts/deployment_authority_study.py \
            --output-json pr130-results.json \
            --output-markdown pr130-results.md
          code=$?
          echo "Study exit code: $code"
          if [[ -f pr130-results.json ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("pr130-results.json").read_text())
          print(json.dumps(report["summary"], indent=2))
          for case in report["cases"]:
              agents=case.get("report", {}).get("reconciliation", {}).get("agents", [])
              for agent in agents:
                  required=agent.get("required", {}).get("roles", [])
                  missing=agent.get("missing", {}).get("roles", [])
                  if "roles/cloudsql.client" in required or case["case_id"] == "natural-008":
                      print(case["case_id"], agent.get("agent"), agent.get("status"))
                      print("required", required)
                      print("missing", missing)
                      print("evidence", json.dumps(agent.get("evidence", {}).get("required_authority", []), indent=2))
          PY
          fi
          if [[ "$code" == "2" ]]; then exit 2; fi
          exit 0
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr130-cloudsql-validation
          path: |
            pr130-results.json
            pr130-results.md
          if-no-files-found: warn
          retention-days: 30
