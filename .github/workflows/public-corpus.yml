name: Public Corpus Validation

on:
  workflow_dispatch:
  push:
    branches: [v0.4-dev]
    paths:
      - "scripts/public_corpus_scan.py"
      - ".github/workflows/public-corpus.yml"

permissions:
  contents: read

jobs:
  scan:
    name: Scan public agent corpus
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install AgentReachGuard
        run: python -m pip install -e .

      - name: Scan public corpus
        run: python scripts/public_corpus_scan.py

      - name: Upload corpus report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-corpus-report
          path: |
            public-corpus-report.json
            public-corpus-report.md
          if-no-files-found: warn
