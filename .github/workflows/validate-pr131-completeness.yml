name: Validate PR131 Authority Completeness

on:
  push:
    branches:
      - research/validate-pr131-completeness
    paths:
      - ".github/workflows/validate-pr131-completeness.yml"

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Execute frozen cohort with PR131 code
        shell: bash
        run: |
          set +e
          python scripts/deployment_authority_study.py \
            --output-json pr131-results.json \
            --output-markdown pr131-results.md
          code=$?
          echo "Study exit code: $code"
          if [[ -f pr131-results.json ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("pr131-results.json").read_text())
          print(json.dumps(report["summary"], indent=2))
          for case in report["cases"]:
              security = case.get("report", {})
              completeness = security.get("authority_completeness") or {}
              certs = completeness.get("certificates") or []
              if certs:
                  print(case["case_id"], json.dumps(certs, indent=2))
          PY
          fi
          if [[ "$code" == "2" ]]; then exit 2; fi
          exit 0
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr131-authority-completeness-validation
          path: |
            pr131-results.json
            pr131-results.md
          if-no-files-found: warn
          retention-days: 30
