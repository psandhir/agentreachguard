name: Real World Agent Security Ground Truth

on:
  push:
    branches:
      - research/real-world-study-ground-truth
    paths:
      - "scripts/real_world_agent_security_truth.py"
      - ".github/workflows/real-world-agent-security-truth.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/real_world_agent_security_truth.py"
      - ".github/workflows/real-world-agent-security-truth.yml"
      - "research/real-world-agent-security-2026/**"

permissions:
  contents: write

concurrency:
  group: real-world-agent-security-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  truth:
    name: Source-only truth lock
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out study branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Validate truth builder syntax
        run: python -m py_compile scripts/real_world_agent_security_truth.py

      - name: Build source-only reference truth
        run: |
          python scripts/real_world_agent_security_truth.py --workers 8
          cat research/real-world-agent-security-2026/ground-truth-summary.json | head -80

      - name: Validate locked study state
        run: python scripts/real_world_agent_security_study.py --validate-only

      - name: Check generated diff
        run: git diff --check

      - name: Commit locked truth
        shell: bash
        run: |
          git config user.name "horustrace-study-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/real-world-agent-security-2026/cohort.json
          git add research/real-world-agent-security-2026/ground-truth
          git add research/real-world-agent-security-2026/ground-truth-summary.json
          if git diff --cached --quiet; then
            echo "No generated truth changes."
            exit 0
          fi
          git commit -m "research: lock independent source ground truth"
          git push origin HEAD:research/real-world-study-ground-truth
