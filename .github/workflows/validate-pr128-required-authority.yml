name: Validate PR128 Required Authority

on:
  push:
    branches:
      - research/validate-pr128-required-authority
    paths:
      - ".github/workflows/validate-pr128-required-authority.yml"

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Execute frozen cohort with PR128 code
        id: study
        shell: bash
        run: |
          set +e
          python scripts/deployment_authority_study.py \
            --output-json pr128-results.json \
            --output-markdown pr128-results.md
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Study exit code: $code"
          if [[ -f pr128-results.json ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("pr128-results.json").read_text())
          print(json.dumps(report["summary"], indent=2))
          print("Expected output:")
          print(json.dumps(report["expected_output_confusion_matrix"], indent=2))
          print("Independent security:")
          print(json.dumps(report["security_classification_confusion_matrix"], indent=2))
          for case in report["cases"]:
              agents=case.get("report", {}).get("authority_reconciliation", {}).get("agents", [])
              if agents:
                  print(case["case_id"], json.dumps([
                      {
                          "agent": a.get("agent"),
                          "status": a.get("status"),
                          "required": a.get("required"),
                          "deployed": a.get("deployed"),
                          "missing": a.get("missing"),
                          "excess": a.get("excess"),
                          "unresolved": a.get("unresolved"),
                      }
                      for a in agents
                  ]))
          PY
          fi
          # Exit 1 means the frozen v0.8 expected-output oracle changed, which is
          # the measurement this validation run is intended to capture.
          if [[ "$code" == "2" ]]; then exit 2; fi
          exit 0
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr128-required-authority-validation
          path: |
            pr128-results.json
            pr128-results.md
          if-no-files-found: warn
          retention-days: 30
