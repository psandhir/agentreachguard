name: Frozen FastAgent Validation

on:
  push:
    branches:
      - research/fast-agent-validation
    paths:
      - "scripts/fast_agent_validation.py"
      - ".github/workflows/frozen-fast-agent-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out HorusTrace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install current HorusTrace
        run: python -m pip install -e .

      - name: Fetch frozen FastAgent repository
        run: |
          git init -q /tmp/fast-agent
          git -C /tmp/fast-agent remote add origin https://github.com/evalstate/fast-agent.git
          git -C /tmp/fast-agent fetch --quiet --depth=1 --filter=blob:none origin 96ded66a3d21472047859808ae30095390607171
          git -C /tmp/fast-agent checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/fast-agent rev-parse HEAD)" = "96ded66a3d21472047859808ae30095390607171"

      - name: Validate frozen FastAgent coverage
        run: |
          python scripts/fast_agent_validation.py /tmp/fast-agent \
            --output fast-agent-validation.json

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frozen-fast-agent-validation
          path: fast-agent-validation.json
          if-no-files-found: warn
