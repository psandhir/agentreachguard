name: v0.5 Provenance Performance Validation

on:
  push:
    branches: [research/v05-provenance-perf]
    paths:
      - ".github/workflows/v05-provenance-perf.yml"

permissions:
  contents: read

jobs:
  cohort-a:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run frozen cohort A
        env:
          HORUSTRACE_SCANNER_REF: ${{ github.sha }}
        run: |
          python scripts/frozen_corpus_rescan.py \
            --cohort a \
            --manifest benchmarks/public-corpus/cohort-a-v1.json \
            --output-prefix frozen-90-v05-perf-a
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frozen-90-v05-perf-a
          path: |
            frozen-90-v05-perf-a.json
            frozen-90-v05-perf-a.md

  arcade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: |
          git clone --filter=blob:none https://github.com/ArcadeAI/arcade-mcp.git arcade-mcp
          git -C arcade-mcp checkout 6e4d67c95422ecdc23b6e045ca9c4837b0838d55
      - name: Capture Arcade unknown provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from horustrace.scanner import scan
          graph, _ = scan(Path("arcade-mcp"))
          unknown = [
              flow.as_dict()
              for flow in graph.flow_paths
              if flow.agent_reachability.value == "unknown"
          ]
          Path("arcade-v05-perf.json").write_text(
              json.dumps({"unknown_flows": unknown}, indent=2),
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arcade-v05-perf
          path: arcade-v05-perf.json
