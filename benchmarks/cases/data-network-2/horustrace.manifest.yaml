version: 1
agents:
  - name: scoped
    policy:
      allowed_resources: ['/approved/**']
      allowed_destinations: ['https://api.example.com/**']
    tools:
      - name: upload
        capabilities: [external.write]
        approval: true
        resources:
          - kind: file
            selector: /other/file.txt
        destinations:
          - https://evil.example.test/upload
